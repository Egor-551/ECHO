<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ECHO</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070914;color:#fff;font-family:Arial,sans-serif;touch-action:manipulation}
canvas{display:block;width:100vw;height:100dvh;background:#090d1b}
#ui{position:fixed;inset:0;pointer-events:none}
button{pointer-events:auto;border:1px solid #5966a8;background:#171d38;color:#fff;border-radius:14px;padding:13px 22px;font-size:17px;font-weight:bold}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#080b19dd,#10152add);text-align:center;padding:24px}
h1{font-size:58px;letter-spacing:12px;margin:0;color:#9ceaff;text-shadow:0 0 22px #36cfff}
.sub{color:#aab5dc;max-width:300px;line-height:1.5}
.hidden{display:none}
#hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:bold}
#hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#b7c3e9;font-size:13px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
<div id="hud" class="hidden"><span id="score">0 м</span><span id="gems">◇ 0</span></div>
<div id="menu" class="panel">
<h1>ECHO</h1>
<div class="sub">Прыгай между стенами. Собирай кристаллы. Не дай теням догнать тебя.</div>
<div>Рекорд: <b id="best">0</b> м　◇ <b id="bank">0</b></div>
<button id="play">ИГРАТЬ</button>
<button id="shopBtn">МАГАЗИН</button>
<div class="sub">Нажми на экран, чтобы прыгнуть на другую стену.</div>
</div>
<div id="shop" class="panel hidden">
<h1 style="font-size:38px">МАГАЗИН</h1>
<div id="shopInfo" class="sub"></div>
<button id="buy">Купить / выбрать</button>
<button id="back">НАЗАД</button>
</div>
<div id="over" class="panel hidden">
<h1 style="font-size:42px">ПРОИГРЫШ</h1>
<div id="result" class="sub"></div>
<button id="again">ЗАНОВО</button>
<button id="home">МЕНЮ</button>
</div>
<div id="hint" class="hidden">Нажми в любой части экрана, чтобы прыгнуть</div>
</div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,scale=1;
function resize(){
W=c.width=innerWidth*devicePixelRatio;
H=c.height=innerHeight*devicePixelRatio;
scale=devicePixelRatio;
ctx.setTransform(scale,0,0,scale,0,0)
}
addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let best=load('echoBest',0),bank=load('echoGems',0),skin=load('echoSkin',0),owned=load('echoOwned',[0]),state='menu';
const skins=[['Basic',0],['Apprentice',20],['Knight',50],['Wizard',100],['Dragon',200],['Void',400],['Cosmic',800]];
let p,shadows,spikes,gems,dist,runGems,frame,last=0,acc=0,side=1;
function show(s){
state=s;
['menu','shop','over'].forEach(x=>$(x).classList.toggle('hidden',x!==s));
$('hud').classList.toggle('hidden',s!=='play');
$('hint').classList.toggle('hidden',s!=='play')
}
function start(){
p={x:side>0?W/scale-28:8,y:H/scale*.65,vx:0,vy:0,jump:false};
side=1;shadows=[];spikes=[];gems=[];
dist=0;runGems=0;frame=0;acc=0;
makeWorld();show('play')
}
function makeWorld(){
let y=-100;
for(let i=0;i<12;i++){
let yy=y-i*180;
if(i>2){
if(i%3!==0)spikes.push({y:yy,x:i%2?0:W/scale-25,h:36});
if(i%2===0)gems.push({y:yy-65,x:W/scale/2,r:8,got:false})
}
}
}function jump(){
if(state!=='play')return;
if(!p.jump){p.vx=-side*10.5;p.vy=-1;p.jump=true}
}
addEventListener('pointerdown',e=>{if(state==='play')jump()});
function tick(){
if(state!=='play')return;
frame++;dist+=.8;p.y-=.8;
if(p.jump){
p.x+=p.vx;p.y+=p.vy;p.vy+=.42;
if((side===1&&p.x<8)||(side===-1&&p.x>W/scale-30)){
side*=-1;p.x=side===1?W/scale-28:8;
p.vx=0;p.vy=0;p.jump=false
}
}else{
p.x=side===1?W/scale-28:8;p.y-=.55
}
if(frame%210===0&&shadows.length<6)
shadows.push({x:side===1?8:W/scale-28,y:p.y+250,side:side===1?-1:1,speed:1.05+Math.random()*.5});
shadows.forEach(s=>{
s.y-=s.speed;s.x=s.side===1?W/scale-28:8;
if(Math.abs(s.x-p.x)<24&&Math.abs(s.y-p.y)<25)die()
});
spikes.forEach(o=>{
let sy=H/scale*.65-(o.y-dist);
if(sy>0&&sy<H/scale&&p.x<o.x+25&&p.x+20>o.x&&Math.abs(p.y-H/scale*.65)<45)die()
});
gems.forEach(g=>{
let gy=H/scale*.65-(g.y-dist);
if(!g.got&&Math.abs(gy-H/scale*.65)<24&&Math.abs(g.x-p.x)<30){
g.got=true;runGems++;bank++;save('echoGems',bank)
}
});
if(frame%220===0)makeWorld();
$('score').textContent=Math.floor(dist/10)+' м';
$('gems').textContent='◇ '+runGems
}
function die(){
if(state!=='play')return;
best=Math.max(best,Math.floor(dist/10));
save('echoBest',best);
$('result').textContent='Результат: '+Math.floor(dist/10)+' м · Кристаллы: '+runGems;
show('over')
}
function draw(){
let w=W/scale,h=H/scale;
ctx.clearRect(0,0,w,h);
let grad=ctx.createLinearGradient(0,0,0,h);
grad.addColorStop(0,'#090d20');grad.addColorStop(1,'#15112b');
ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
ctx.strokeStyle='#28345c';ctx.lineWidth=4;
ctx.beginPath();ctx.moveTo(5,0);ctx.lineTo(5,h);
ctx.moveTo(w-5,0);ctx.lineTo(w-5,h);ctx.stroke();
if(state==='play'){
spikes.forEach(o=>{
let y=h*.65-(o.y-dist);
if(y>-60&&y<h+60){
ctx.fillStyle='#fa537f';ctx.beginPath();
let x=o.x;ctx.moveTo(x,y);ctx.lineTo(x+25,y-38);
ctx.lineTo(x+50,y);ctx.fill()
}
});
gems.forEach(g=>{
let y=h*.65-(g.y-dist);
if(!g.got&&y>-20&&y<h+20){
ctx.fillStyle='#70f5ff';ctx.shadowColor='#43eaff';ctx.shadowBlur=15;
ctx.beginPath();ctx.arc(g.x,y,g.r,0,Math.PI*2);ctx.fill();
ctx.shadowBlur=0
}
});
shadows.forEach(s=>{
let y=h*.65-(s.y-dist);
ctx.fillStyle='#8b64ff';ctx.shadowColor='#7650ff';ctx.shadowBlur=22;
ctx.beginPath();ctx.arc(s.x+10,y+13,14,0,Math.PI*2);ctx.fill();
ctx.shadowBlur=0
});
ctx.fillStyle=['#9ceaff','#e4bdff','#c5d2ff','#d6a5ff','#ff9c6a','#9c75ff','#fff0a0'][skin];
ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=18;
ctx.fillRect(p.x,p.y,20,26);ctx.shadowBlur=0
}
}
function loop(t){
let dt=Math.min(.05,(t-last)/1000||0);last=t;
if(state==='play'){
acc+=dt;
while(acc>=1/60){tick();acc-=1/60}
}
draw();requestAnimationFrame(loop)
}
requestAnimationFrame(loop);
$('play').onclick=start;
$('again').onclick=start;
$('home').onclick=()=>{
$('best').textContent=best;$('bank').textContent=bank;show('menu')
};
$('shopBtn').onclick=()=>{updateShop();show('shop')};
$('back').onclick=()=>show('menu');
function updateShop(){
let [name,cost]=skins[skin];
$('shopInfo').textContent=name+' — '+(cost?'◇ '+cost:'БЕСПЛАТНО')+' · У тебя ◇ '+bank;
$('buy').textContent=owned.includes(skin)?'ВЫБРАТЬ':'КУПИТЬ';
}
$('buy').onclick=()=>{
let cost=skins[skin][1];
if(!owned.includes(skin)){
if(bank<cost){$('shopInfo').textContent='Недостаточно кристаллов';return}
bank-=cost;owned.push(skin);save('echoGems',bank);save('echoOwned',owned)
}
save('echoSkin',skin);updateShop()
};
$('shop').addEventListener('click',e=>{
if(e.target.id==='shop'||e.target.id==='shopInfo'){
skin=(skin+1)%skins.length;updateShop()
}
});
$('best').textContent=best;$('bank').textContent=bank;
})();
</script>
</body>
</html>
